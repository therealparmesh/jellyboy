name: jellyboy

options:
  bundleIdPrefix: com.parmesh
  createIntermediateGroups: true
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7654L3CX5L
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    VERSIONING_SYSTEM: apple-generic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: e3774eb25c62c902e9066ba267e6416d82e83382

targets:
  jellyboy:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parmesh.jellyboy
        PRODUCT_NAME: jellyboy
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) @executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) @executable_path/Frameworks"
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: jellyboy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: jellyboy connects directly to the Jellyfin server you choose.
        UIAppFonts:
          - jellyboy-pixel.ttf
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  jellyboyTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Tests/jellyboyTests
    dependencies:
      - target: jellyboy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parmesh.jellyboy.tests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/jellyboy.app/Contents/MacOS/jellyboy"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/jellyboy.app/jellyboy"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  jellyboy:
    build:
      targets:
        jellyboy: all
        jellyboyTests: [test]
    test:
      targets:
        - jellyboyTests
